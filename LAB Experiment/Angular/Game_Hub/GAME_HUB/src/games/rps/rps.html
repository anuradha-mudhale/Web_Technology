<div class="game-card">
  <h2>✊ Rock Paper Scissors</h2>

  <div class="scoreboard">
    <span>User: {{userScore}}</span>
    <span>Computer: {{computerScore}}</span>
  </div>

  <div class="choices">
    <button class="choice-btn" (click)="play('Rock')">✊ Rock</button>
    <button class="choice-btn" (click)="play('Paper')">✋ Paper</button>
    <button class="choice-btn" (click)="play('Scissors')">✌️ Scissors</button>
  </div>

  <div class="result">
    <p>You: {{userChoice}}</p>
    <p>Computer: {{computerChoice}}</p>
    <h3>{{result}}</h3>
  </div>

  <button class="reset-btn" (click)="reset()">Reset</button>
</div>
