  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }

    body {
      background: linear-gradient(135deg,#eef2ff,#dbeafe);
      padding-top: 95px;

    /* Navbar */
    .custom-navbar {
      background: linear-gradient(90deg,#4e54c8,#8f94fb);

    /* Form */
    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align:center;
      color:#4e54c8;
      margin-bottom:20px;
    }

    input {
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button {
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4e54c8;
      color:white;

<div class="form-container">
  <h2>Return Book</h2>

  <form id="returnForm">
    <input type="number" id="returnBID" placeholder="Book ID" required>
    <input type="text" id="returnSname" placeholder="Student Name" required>
     <input type="text" id="returnbbname" placeholder="Book Name" required>
    <input type="date" id="actualReturnDate" required>
