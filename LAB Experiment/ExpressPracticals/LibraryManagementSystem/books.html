<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Books | Smart Library</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      padding-top: 90px;
    }

    .custom-navbar {
      background: linear-gradient(90deg, #4e54c8, #8f94fb);
      padding: 12px 0;
    }

    .navbar-brand {
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      color: white !important;
    }

    .navbar-nav .nav-link {
      color: white !important;
      font-weight: 500;
      margin-left: 10px;
      border-radius: 8px;
      padding: 8px 14px !important;
      transition: 0.3s;
    }

    .navbar-nav .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffd43b !important;
    }

    .navbar-nav .nav-link.active {
      background-color: white;
      color: #4e54c8 !important;
      font-weight: 600;
    }

    .logout-btn {
      background-color: #ff4d6d;
      color: white !important;
      border-radius: 8px;
      padding: 8px 14px !important;
    }

    .logout-btn:hover {
      background-color: #e63956;
      color: #fff !important;
    }

    .page-container {
      padding: 30px 20px;
    }

    .table-box {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    .page-title {
      text-align: center;
      color: #4e54c8;
      margin-bottom: 25px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th,
    td {
      padding: 14px;
      border: 1px solid #ddd;
    }

    th {
      background: #4e54c8;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f8f9ff;
    }

    tr:hover {
      background-color: #eef1ff;
    }

    .empty-text {
      text-align: center;
      color: #777;
      padding: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg custom-navbar shadow fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">📚 Smart Library</a>

      <button
        class="navbar-toggler bg-light"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Dashboard</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="add-book.html">Add Book</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="books.html">View Books</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="issue-book.html">Issue Book</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="return-book.html">Return Book</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="history.html">History</a>
          </li>

          <li class="nav-item">
            <a class="nav-link logout-btn" href="#" id="logoutBtn">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container page-container">
    <div class="table-box">
      <h2 class="page-title">Library Books List</h2>

      <table>
        <thead>
          <tr>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Author Name</th>
            <th>Category</th>
            <th>Quantity</th>
          </tr>
        </thead>
        <tbody id="bookTableBody">
        </tbody>
      </table>

      <p id="emptyMessage" class="empty-text" style="display: none;">
        No books added yet.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
