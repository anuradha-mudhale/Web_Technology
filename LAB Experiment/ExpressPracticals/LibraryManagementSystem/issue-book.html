<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue Book | Smart Library</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    /* ===== Same styling as Add Book page ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #eef2ff, #dbeafe); min-height: 100vh; padding-top: 95px; }

    .custom-navbar { background: linear-gradient(90deg, #4e54c8, #8f94fb); padding: 12px 0; }
    .navbar-brand { font-size: 1.4rem; letter-spacing: 0.5px; color: white !important; }
    .navbar-nav .nav-link { color: white !important; font-weight: 500; margin-left: 10px; border-radius: 8px; padding: 8px 14px !important; transition: 0.3s; }
    .navbar-nav .nav-link:hover { background-color: rgba(255,255,255,0.2); color: #ffd43b !important; }
    .navbar-nav .nav-link.active { background-color: white; color: #4e54c8 !important; font-weight: 600; }
    .logout-btn { background-color: #ff4d6d; color: white !important; border-radius: 8px; padding: 8px 14px !important; }
    .logout-btn:hover { background-color: #e63956; color: #fff !important; }

    .page-wrapper { display: flex; justify-content: center; align-items: flex-start; padding: 30px 15px; }
    .form-container { width: 100%; max-width: 520px; background: white; padding: 30px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); }
    .form-container h2 { text-align: center; margin-bottom: 25px; color: #4e54c8; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; outline: none; transition: 0.3s; }
    input:focus { border-color: #4e54c8; box-shadow: 0 0 0 3px rgba(78,84,200,0.15); }
    button[type="submit"] { width: 100%; padding: 13px; border: none; border-radius: 10px; background: linear-gradient(90deg,#4e54c8,#8f94fb); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(78,84,200,0.25); }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-expand-lg custom-navbar shadow fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">📚 Smart Library</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="add-book.html">Add Book</a></li>
          <li class="nav-item"><a class="nav-link" href="books.html">View Books</a></li>
          <li class="nav-item"><a class="nav-link active" href="issue-book.html">Issue Book</a></li>
          <li class="nav-item"><a class="nav-link" href="return-book.html">Return Book</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
          <li class="nav-item">
            <a class="nav-link logout-btn" href="#" id="logoutBtn">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Issue Book Form ===== -->
  <div class="page-wrapper">
    <div class="form-container">
      <h2>Issue Book</h2>
      <form id="issueForm">
        <div class="form-group">
          <label for="issueBID">Book ID</label>
          <input type="number" id="issueBID" name="issueBID" required />
        </div>
        <div class="form-group">
          <label for="issueBname">Book Name</label>
          <input type="text" id="issueBname" name="issueBname" required />
        </div>
        <div class="form-group">
          <label for="issueSname">Student Name</label>
          <input type="text" id="issueSname" name="issueSname" required />
        </div>
        <div class="form-group">
          <label for="issueDate">Issue Date</label>
          <input type="date" id="issueDate" name="issueDate" required />
        </div>
        <div class="form-group">
          <label for="returnDate">Return Date</label>
          <input type="date" id="returnDate" name="returnDate" required />
        </div>
        <button type="submit">Issue Book</button>
      </form>
    </div>
  </div>
<script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="issue-script.js"></script> <!-- your JS file -->
</body>
</html>
