<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History | Smart Library</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }

    body {
      background: linear-gradient(135deg,#eef2ff,#dbeafe);
      padding-top: 95px;
    }

    /* Navbar */
    .custom-navbar {
      background: linear-gradient(90deg,#4e54c8,#8f94fb);
      padding: 12px 0;
    }

    .navbar-brand { color:white !important; font-weight:bold; }
    .nav-link { color:white !important; margin-left:10px; }
    .nav-link.active {
      background:white;
      color:#4e54c8 !important;
      border-radius:8px;
      font-weight:600;
    }

    .logout-btn {
      background:#ff4d6d;
      border-radius:8px;
      padding:8px 14px !important;
    }

    /* Table */
    .container-box {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align:center;
      color:#4e54c8;
      margin-bottom:20px;
    }

    table {
      margin-top: 15px;
    }

    #emptyMessage {
      text-align:center;
      color: red;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg custom-navbar shadow fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">📚 Smart Library</a>

    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="add-book.html">Add Book</a></li>
        <li class="nav-item"><a class="nav-link" href="books.html">View Books</a></li>
        <li class="nav-item"><a class="nav-link" href="issue-book.html">Issue Book</a></li>
        <li class="nav-item"><a class="nav-link" href="return-book.html">Return Book</a></li>

        <!-- Active Page -->
        <li class="nav-item"><a class="nav-link active" href="history.html">History</a></li>

        
       <li class="nav-item">
            <a class="nav-link logout-btn" href="#" id="logoutBtn">Logout</a>
          </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ===== History Table ===== -->
<div class="container-box mt-4">
  <h2>Library History</h2>

  <table class="table table-bordered table-striped text-center">
    <thead class="table-dark">
      <tr>
        <th>Book ID</th>
        <th>Book Name</th>
        <th>Student</th>
        <th>Date</th>
        <th>Status</th>
         <th>Action</th> 
      </tr>
    </thead>

    <tbody id="historyTableBody">
      <!-- Data will come from JS -->
    </tbody>
  </table>

  <p id="emptyMessage">No History Available</p>
</div>

<!-- JS -->
 <script src="script.js"></script>
<script src="history.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
