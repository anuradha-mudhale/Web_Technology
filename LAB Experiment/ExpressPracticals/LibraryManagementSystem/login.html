<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Animated Gradient Background */
      background: linear-gradient(-45deg, #6a11cb, #2575fc, #ff9966, #ff5e62);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass Effect Box */
    .login-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 35px;
      border-radius: 15px;
      width: 320px;
      text-align: center;
      color: white;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    input::placeholder {
      color: #555;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff7b54;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff5722;
      transform: scale(1.05);
    }

    /* Optional Library Icon Text */
    .logo {
      font-size: 22px;
      margin-bottom: 10px;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">📚 Smart Library</div>
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Enter Username" />
    <input type="password" id="password" placeholder="Enter Password" />

    <button id="loginBtn">Login</button>
  </div>

  <script src="login.js"></script>

</body>
</html>
