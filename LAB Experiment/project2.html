<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Digital ID Card Generator</title>

<!-- html2canvas for download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
    background: linear-gradient(to right,#f5f5f5,#e6d3b3);
    font-family: "Segoe UI", sans-serif;
}

/* Layout */
.wrapper{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:40px;
    flex-wrap:wrap;
}

/* Form */
.form-box{
    width:340px;
    background:#fffaf0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.form-box h2{
    text-align:center;
    color:#4b2e1e;
}

.form-box label{
    font-size:13px;
    color:#4b2e1e;
    margin-top:8px;
    display:block;
}

.form-box input,
.form-box button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    font-size:14px;
}

.form-box input{
    border:1px solid #ccc;
}

.form-box button{
    background:#8b5e3c;
    color:white;
    border:none;
    cursor:pointer;
}

.form-box button:hover{
    background:#6f462a;
}

/* ID Card */
.id-card{
    width:260px;
    height:420px;
    background:white;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #ccc;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    position:relative;
}

/* Header */
.card-header{
    background:linear-gradient(to right,#1f3c88,#3a5ba0);
    color:white;
    text-align:center;
    padding:10px;
}

.card-header h3{
    margin:2px 0;
    font-size:14px;
}

/* Body */
.card-body{
    text-align:center;
    padding:10px;
}

.card-body img{
    width:100px;
    height:120px;
    object-fit:cover;
    border:2px solid #333;
    margin:8px 0;
}

.card-body h4{
    margin:5px 0;
    font-size:14px;
}

.card-body p{
    font-size:11px;
    margin:3px 0;
}

/* Footer */
.card-footer{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    font-size:11px;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- Form Section -->
    <div class="form-box">
        <h2>ID Card Details</h2>

        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="idno" placeholder="PRN / ID Number">
        <input type="text" id="dept" placeholder="Department / Role">
        <input type="text" id="institute" placeholder="Educational Institute Name">
        <input type="text" id="signature" placeholder="Signature Name">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">

        <label for="photo">Upload Photo</label>
        <input type="file" id="photo" accept="image/*">

        <button onclick="generateCard()">Generate ID Card</button>
        <button onclick="downloadCard()">Download ID Card</button>
    </div>

    <!-- ID Card Preview -->
    <div class="id-card" id="card">

        <div class="card-header">
            <p id="instituteDisplay">Educational Institute</p>
            <h3>SMART DIGITAL ID</h3>
        </div>

        <div class="card-body">
            <img id="profileImage" src="https://via.placeholder.com/100">
            <h4 id="nameDisplay">Your Name</h4>
            <p id="deptDisplay">Department / Role</p>
            <p><b>ID:</b> <span id="idDisplay">---</span></p>
            <p><b>DOB:</b> <span id="dobDisplay">---</span></p>
        </div>

        <div class="card-footer">
            <span id="signatureDisplay">Authorized Signature</span>
        </div>
    </div>

</div>

<script>
function generateCard(){
    document.getElementById("nameDisplay").innerText =
        document.getElementById("name").value || "Your Name";

    document.getElementById("deptDisplay").innerText =
        document.getElementById("dept").value || "Department / Role";

    document.getElementById("idDisplay").innerText =
        document.getElementById("idno").value || "---";

    document.getElementById("dobDisplay").innerText =
        document.getElementById("dob").value || "---";

    document.getElementById("instituteDisplay").innerText =
        document.getElementById("institute").value || "Educational Institute";

    document.getElementById("signatureDisplay").innerText =
        document.getElementById("signature").value || "Authorized Signature";
}

document.getElementById("photo").addEventListener("change",function(){
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = e =>
            document.getElementById("profileImage").src = e.target.result;
        reader.readAsDataURL(file);
    }
});

function downloadCard(){
    html2canvas(document.getElementById("card")).then(canvas=>{
        const link = document.createElement("a");
        link.download = "ID_Card.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}
</script>

</body>
</html>
